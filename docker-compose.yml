x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    image: ${SUPERMEW_APP_IMAGE:-supermew-app:dev}
    restart: unless-stopped
    logging: *default-logging
    env_file: ${SUPERMEW_ENV_FILE:-.env}
    environment:
      EMBEDDING_DEVICE: cpu
      HF_HOME: /app/model-cache
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8000}:8000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data:/app/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/huggingface:/app/model-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      standalone:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15}
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: langchain_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5432}:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langchain_app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    command: ["sh", "-c", "if [ -n \"$${REDIS_PASSWORD}\" ]; then exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"; else exec redis-server --appendonly yes; fi"]
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-6379}:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.18}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: ${MINIO_IMAGE:-jumpserver/minio:RELEASE.2024-05-28T17-19-04Z@sha256:7acff8117e16e8b26b0ff2e3acdd4d4d1cef340a1b7364050b37b4a80b6636d4}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" --config-dir /tmp/mc-health >/dev/null && mc ready local --config-dir /tmp/mc-health"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.14}
    restart: unless-stopped
    logging: *default-logging
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:${MILVUS_BIND_PORT:-19530}:19530"
      - "127.0.0.1:${MILVUS_HEALTH_BIND_PORT:-9091}:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
  attu:
    image: ${ATTU_IMAGE:-zilliz/attu:v2.5.11}
    profiles: ["debug"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      - MILVUS_URL=standalone:19530  
      - PORT=3000
    ports:
      - "127.0.0.1:${ATTU_BIND_PORT:-8080}:3000"
    depends_on:
      - standalone
